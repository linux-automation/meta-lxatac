DISTRO = "tacos"
DISTRO_NAME = "TAC OS - The LXA TAC operating system"
DISTRO_VERSION = "25.09+dev"
DISTRO_CODENAME = "tacos-wrynose"

MAINTAINER = "Linux Automation GmbH <info@linux-automation.com>"

LOCALCONF_VERSION = "2"

DISTRO_FEATURES_DEFAULTS ?= "pulseaudio gobject-introspection-data ldconfig opengl multiarch wayland vulkan"
DISTRO_FEATURES = "\
    alsa \
    argp \
    bluetooth \
    ext2 \
    ipv6 \
    minidebuginfo \
    multiarch \
    nfs \
    pni-names \
    polkit \
    rauc \
    seccomp \
    security \
    systemd \
    usbgadget \
    usbhost \
    usrmerge \
    virtualization \
    wifi \
    xattr \
    zeroconf \
"
DISTRO_FEATURES_OPTED_OUT += "ptest"

# Select systemd as init manager
INIT_MANAGER ?= "systemd"

# Set static uids/gids to allow migration and shared partitions
# between update slots.
USERADDEXTENSION = "useradd-staticids"
USERADD_ERROR_DYNAMIC = "error"
USERADD_UID_TABLES = "files/passwd"
USERADD_GID_TABLES = "files/group"

# Reduce read/write/directory permissions for /srv to indicate that it should
# only be used as a mount point and that no files should be written there.
FILESYSTEM_PERMS_TABLES += "files/fs-perms-srv-ro.txt"

# Don't symlink /var/log to /var/log/volatile as we do actually want
# persistent logging.
FILESYSTEM_PERMS_TABLES:remove = "files/fs-perms-volatile-log.txt"

# add build info file (/etc/build) to rootfs to ease traceability
INHERIT += "image-buildinfo"

INHERIT += "uninative"

# Enable creation of SPDX manifests and vulnerability exploitability
# exchange files.
# Exclude CVEs that are known to not affect yocto.
require conf/distro/include/cve-extra-exclusions.inc
INHERIT += "create-spdx vex"
SPDX_INCLUDE_VEX = "all"

# Create a directory for each package in `/usr/share/licenses`
# and place licensing information there.
LICENSE_CREATE_PACKAGE = "1"
COPY_LIC_MANIFEST = "1"

BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# recommend ipk package management - make sure to comment or set it in local.conf.sample
PACKAGE_CLASSES ?= "package_ipk"

# There are two providers for libnss-mdns: avahi-libnss-mdns and mdns.
# The former is in oe-core and the latter in meta-oe. Choose the former.
PREFERRED_RPROVIDER_libnss-mdns = "avahi-libnss-mdns"
